<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Asociación Oye Vecino</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#00327d;--ink:#00183d;--amber:#efa017;--muted:#55627c;--gutter:clamp(20px,4.5vw,64px);}
  *,*::before,*::after{box-sizing:border-box;}
  body{margin:0;min-height:100svh;display:grid;grid-template-rows:auto 1fr;background:#fff;color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased;}
  :focus-visible{outline:3px solid var(--amber);outline-offset:3px;border-radius:4px;}
  header{padding:20px var(--gutter);}
  .brand{display:inline-flex;align-items:center;gap:12px;text-decoration:none;font-family:'League Spartan',sans-serif;font-weight:800;font-size:1.3rem;color:var(--ink);}
  .brand img{height:34px;width:auto;}
  .brand b{color:inherit;}
  main{display:flex;flex-direction:column;justify-content:center;padding:0 var(--gutter) 12vh;max-width:1320px;}
  h1{font-family:'League Spartan',sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(3rem,9vw,8rem);line-height:.88;letter-spacing:-.035em;margin:0;}
  h1 span{display:inline-block;width:.19em;height:.19em;border-radius:50%;background:var(--amber);margin-left:.05em;}
  p{max-width:44ch;color:#2a3a5c;margin:28px 0 0;font-size:1.15rem;}
  a.btn{display:inline-flex;align-items:center;gap:.6em;margin-top:32px;align-self:flex-start;font-family:'League Spartan',sans-serif;font-weight:700;font-size:1.05rem;padding:1.05em 1.6em .95em;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;transition:background .3s;}
  a.btn:hover{background:var(--ink);}
</style>
</head>
<body>
  <header><a class="brand" href="/"><img src="/assets/logo-color.png" alt="" width="48" height="34"><span>OYE <b>VE</b>CINO</span></a></header>
  <main>
    <h1>Esta página no existe<span aria-hidden="true"></span></h1>
    <p>Puede que el enlace esté mal escrito o que la página se haya movido. Vuelve al inicio para seguir conociendo el proyecto.</p>
    <a class="btn" href="/">Volver al inicio</a>
  </main>
</body>
</html>
